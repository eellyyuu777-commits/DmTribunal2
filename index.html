let loginMode = true;
let freeAnalyses = 5;

const savedFreeAnalyses =
localStorage.getItem("freeAnalyses");

if(savedFreeAnalyses !== null){

freeAnalyses = parseInt(savedFreeAnalyses);

}

function openAuth(){

document.getElementById("auth").style.display = "flex";

}

function closeAuth(){

document.getElementById("auth").style.display = "none";

}

function toggleAuthMode(){

loginMode = !loginMode;

const title =
document.getElementById("authTitle");

const button =
document.getElementById("authButton");

const switchText =
document.querySelector(".switch span");

const emailField =
document.getElementById("email");

if(loginMode){

title.innerHTML = "Connexion";

button.innerHTML = "Se connecter";

switchText.innerHTML =
"Pas encore de compte ? Créer un compte";

emailField.style.display = "none";

}

else{

title.innerHTML = "Créer un compte";

button.innerHTML = "Créer le compte";

switchText.innerHTML =
"Déjà un compte ? Se connecter";

emailField.style.display = "block";

}

}

function submitAuth(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const email =
document.getElementById("email").value;

if(loginMode){

if(username === "" || password === ""){

alert("Remplis tous les champs");

return;

}

const users =
JSON.parse(localStorage.getItem("users")) || [];

const user =
users.find(
u =>
u.username === username &&
u.password === password
);

if(!user){

alert("Nom d'utilisateur ou mot de passe incorrect");

return;

}

localStorage.setItem(
"loggedIn",
"true"
);

localStorage.setItem(
"loggedUser",
username
);

alert("Connexion réussie ✅");

closeAuth();

}

else{

if(
username === "" ||
password === "" ||
email === ""
){

alert("Remplis tous les champs");

return;

}

const users =
JSON.parse(localStorage.getItem("users")) || [];

const alreadyExists =
users.find(
u => u.username === username
);

if(alreadyExists){

alert("Ce nom d'utilisateur existe déjà");

return;

}

users.push({
username,
password,
email
});

localStorage.setItem(
"users",
JSON.stringify(users)
);

localStorage.setItem(
"loggedIn",
"true"
);

localStorage.setItem(
"loggedUser",
username
);

alert("Compte créé avec succès ✅");

closeAuth();

}

}

window.onclick = function(event){

const auth =
document.getElementById("auth");

if(event.target === auth){

closeAuth();

}

}

function scrollToAnalyzer(){

document
.getElementById("analyzer")
.scrollIntoView({
behavior:"smooth"
});

}

function scrollToSection(id){

document
.getElementById(id)
.scrollIntoView({
behavior:"smooth"
});

}

function previewImage(event){

const file = event.target.files[0];

if(!file) return;

if(file.type.startsWith("image/")){

const preview =
document.getElementById("preview");

preview.src =
URL.createObjectURL(file);

preview.style.display = "block";

}

}

function analyzeConversation(){

const isLoggedIn =
localStorage.getItem("loggedIn");

if(
freeAnalyses <= 0 &&
!isLoggedIn
){

alert(
"Tu as utilisé tes 5 analyses gratuites. Connecte-toi ou crée un compte pour continuer."
);

openAuth();

return;

}

const text =
document
.getElementById("conversation")
.value
.toLowerCase();

if(text.trim() === ""){

alert("Ajoute une conversation");

return;

}

let positive = 0;
let negative = 0;

const positiveWords = [

"❤️",
"🥰",
"😍",
"mdr",
"love",
"viens",
"tu me manques",
"beau",
"belle",
"hâte",
"ensemble",
"😘",
"jtm",
"t'aime"

];

const negativeWords = [

"ok",
"vu",
"tg",
"laisse moi",
"ferme la",
"bye",
"jsp",
"flemme",
"tais toi",
"non",
"jamais",
"mdrrr",
"bah",
"hein"

];

positiveWords.forEach(word=>{

if(text.includes(word)){

positive++;

}

});

negativeWords.forEach(word=>{

if(text.includes(word)){

negative++;

}

});

const result =
document.getElementById("result");

const verdict =
document.getElementById("verdict");

const analysis =
document.getElementById("analysis");

result.style.display = "block";

if(positive >= 3 && negative <= 1){

verdict.innerHTML =
"🟢 ACQUITTÉ";

analysis.innerHTML =
"Très forte chaleur émotionnelle détectée. La conversation paraît naturelle, engageante et réciproque.";

}

else if(negative >= 3){

verdict.innerHTML =
"🔴 CONDAMNÉ";

analysis.innerHTML =
"Conversation très froide détectée. Distance émotionnelle élevée et plusieurs red flags présents.";

}

else{

verdict.innerHTML =
"🟠 COUPABLE";

analysis.innerHTML =
"Conversation mitigée. Quelques signes positifs mais aussi de la froideur émotionnelle.";

}

if(!isLoggedIn){

freeAnalyses--;

localStorage.setItem(
"freeAnalyses",
freeAnalyses
);

}

updateFreeCounter();

}

function updateFreeCounter(){

const isLoggedIn =
localStorage.getItem("loggedIn");

const counter =
document.getElementById("freeCounter");

if(isLoggedIn){

const username =
localStorage.getItem("loggedUser");

counter.innerHTML =
"Connecté en tant que : " + username;

}

else{

counter.innerHTML =
"Analyses gratuites restantes : " +
freeAnalyses +
"/5";

}

}

window.onload = () => {

toggleAuthMode();
toggleAuthMode();

updateFreeCounter();

};
